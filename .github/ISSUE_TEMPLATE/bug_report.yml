name: Bug Report
description: Report a bug or error in the autoscaler controller
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Controller Logs
      description: Paste relevant log output.
    validations:
      required: false
