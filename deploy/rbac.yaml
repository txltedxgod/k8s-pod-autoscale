apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-pod-autoscale-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-pod-autoscale-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-pod-autoscale-binding
subjects:
  - kind: ServiceAccount
    name: k8s-pod-autoscale-sa
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: k8s-pod-autoscale-role
  apiGroup: rbac.authorization.k8s.io
